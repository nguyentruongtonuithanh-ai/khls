<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Debug</title>
</head>
<body>
    <div id="output">Running...</div>
    <script>
        function send(msg) {
            var img = new Image();
            img.src = '/report_log?msg=' + encodeURIComponent(msg);
        }
        window.onerror = function(msg, url, lineNo, colNo, error) {
            var fullMsg = "ERROR: " + msg + " at " + (url ? url.split('/').pop() : '') + ":" + lineNo + ":" + colNo + " | stack: " + (error ? error.stack : 'none');
            send(fullMsg);
        };
        send("LOG: test_debug started");
    </script>
    <script src="js/app.js"></script>
    <script>
        send("LOG: js/app.js parsed successfully");
        try {
            initApp();
            send("DONE: initApp executed successfully");
        } catch(e) {
            send("ERROR in initApp: " + e.message + " | stack: " + e.stack);
        }
    </script>
</body>
</html>

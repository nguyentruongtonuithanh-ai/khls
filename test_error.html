<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
window.__errors = [];
window.onerror = function(msg, url, line, col, error) {
    window.__errors.push({msg: msg, line: line, col: col});
    var d = document.getElementById("err");
    if (!d) {
        d = document.createElement("div");
        d.id = "err";
        document.body.appendChild(d);
    }
    d.textContent = "JS_ERROR: " + msg + " at line " + line + ":" + col;
};
</script>
<script src="js/app.js"></script>
</head>
<body>
<div id="status">loaded</div>
<script>
if (window.__errors.length === 0) {
    var d = document.createElement("div");
    d.id = "err";
    d.textContent = "NO_SYNTAX_ERROR";
    document.body.appendChild(d);
}
</script>
</body>
</html>
